<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lostlines | Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>LostLines Campus Lost & Found Dashboard</h1>
    <p>Report and manage lost or found items.</p>

    <button id="logoutBtn">Logout</button>
    <button id="exportBtn">Export CSV</button>
    <button id="darkModeBtn">Dark Mode</button>
</header>

<main>
    <section>
        <p id="message"></p>
        <h2>Report Lost Item</h2>

        <div class="stats">
            <div class="card">
                <h3>Total</h3>
                <p id="totalCount">0</p>
            </div>

            <div class="card">
                <h3>Lost</h3>
                <p id="lostCount">0</p>
            </div>

            <div class="card">
                <h3>Found</h3>
                <p id="foundCount">0</p>
            </div>
        </div>

        <p>Total Items: <span id="itemCount">0</span></p>

        <select id="sortItems">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
        </select>

        <input type="text" id="searchInput" placeholder="Search by item or location">

        <select id="filterStatus">
            <option value="All">All</option>
            <option value="Lost">Lost</option>
            <option value="Found">Found</option>
        </select>

        <input type="text" id="itemName" placeholder="Item Name">

        <input type="text" id="location" placeholder="Location">

        <select id="status">
            <option value="Lost">Lost</option>
            <option value="Found">Found</option>
        </select>
        <select id="category">
    <option value="Electronics">Electronics</option>
    <option value="Books">Books</option>
    <option value="Documents">Documents</option>
    <option value="Accessories">Accessories</option>
    <option value="Others">Others</option>
</select>

<select id="priority">
    <option value="Low">Low</option>
    <option value="Medium">Medium</option>
    <option value="High">High</option>
</select>

        <button type="button" id="addBtn">Add Item</button>

        <ul id="itemList"></ul>
    </section>
</main>

<footer>
    <p><small>&copy; Lostlines Campus Portal</small></p>
</footer>

<script src="script.js"></script>

</body>
</html>
