<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lostlines | Student Portal</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            padding: 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }

        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand h1 {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, #3b82f6, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .brand p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Toggle Utility class to hide/show forms */
        .hidden {
            display: none !important;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #cbd5e1;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
        }

        input::placeholder {
            color: #475569;
        }

        .submit-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 0.5rem;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
        }

        .switch-mode {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .switch-mode a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
            margin-left: 0.25rem;
        }

        .switch-mode a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand">
            <h1>Lostlines</h1>
            <p id="brand-tagline">Welcome back, login to track your items</p>
        </div>

        <form id="login-form" action="/login" method="POST">
            <div class="form-group">
                <label for="login-email">Student Email</label>
                <input type="email" id="login-email" name="email" placeholder="student@university.edu" required>
            </div>
            
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="submit-btn">Sign In</button>
            
            <div class="switch-mode">
                Don't have an account? <a href="#" id="to-register">Register</a>
            </div>
        </form>

        <form id="register-form" class="hidden" action="/register" method="POST">
            <div class="form-group">
                <label for="reg-name">Full Name</label>
                <input type="text" id="reg-name" name="fullname" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="reg-email">Student Email</label>
                <input type="email" id="reg-email" name="email" placeholder="student@university.edu" required>
            </div>
            
            <div class="form-group">
                <label for="reg-password">Create Password</label>
                <input type="password" id="reg-password" name="password" placeholder="Minimum 8 characters" required>
            </div>
            
            <button type="submit" class="submit-btn">Create Account</button>
            
            <div class="switch-mode">
                Already have an account? <a href="#" id="to-login">Login</a>
            </div>
        </form>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const brandTagline = document.getElementById('brand-tagline');
        const toRegister = document.getElementById('to-register');
        const toLogin = document.getElementById('to-login');

        toRegister.addEventListener('click', (e) => {
            e.preventDefault();
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
            brandTagline.textContent = "Join Lostlines to find your valuables";
        });

        toLogin.addEventListener('click', (e) => {
            e.preventDefault();
            registerForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
            brandTagline.textContent = "Welcome back, login to track your items";
        });
    </script>
</body>
</html>
