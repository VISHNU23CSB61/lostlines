<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lostlines | Student Login</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <header>
        <h1>Lostlines</h1>
        <p>Track and recover your missed valuables.</p>
    </header>

    <main>
        <section>
            <h2>Sign In</h2>
            <form action="/login" method="POST">
                <p>
                    <label for="login-email">Student Email Address:</label><br>
                    <input type="email" id="login-email" name="email" placeholder="e.g., student@university.edu" required>
                </p>
                
                <p>
                    <label for="login-password">Password:</label><br>
                    <input type="password" id="login-password" name="password" required>
                </p>
                
                <p>
                    <input type="submit" value="Login to Account">
                </p>
            </form>
        </section>

        <hr> <section>
            <h2>Create an Account</h2>
            <form action="/register" method="POST">
                <p>
                    <label for="reg-name">Full Name:</label><br>
                    <input type="text" id="reg-name" name="fullname" placeholder="John Doe" required>
                </p>

                <p>
                    <label for="reg-email">University Email Address:</label><br>
                    <input type="email" id="reg-email" name="email" placeholder="e.g., student@university.edu" required>
                </p>
                
                <p>
                    <label for="reg-password">Password:</label><br>
                    <input type="password" id="reg-password" name="password" minlength="8" required>
                </p>
                
                <p>
                    <input type="submit" value="Register">
                </p>
            </form>
        </section>
    </main>

   <footer>
    <p><small>&copy; Lostlines Campus Portal</small></p>
   </footer>

<script src="script.js"></script>

</body>
</html>
